# The whole course as one PDF:
#   quarto render docs --profile pdf --to typst      # writes docs/_book/*.pdf
# Chapter order follows the sidebar in _quarto.yml.

project:
  type: book
  output-dir: _book

book:
  title: "IC101 - Introduction to IC Tools & Workspace"
  subtitle: "Learn how to set up IC tools and workspace on your device."
  author: "UofT ASIC Team"
  output-file: ic101-course
  chapters:
    - index.md
    - part: "1–2. Terminal and git"
      chapters:
        - guide/getting-started.md
        - guide/prerequisites.md
        - labs/lab-01-terminal-and-git-overview.md
    - part: "3–4. Docker"
      chapters:
        - guide/why-containers.md
        - guide/install-docker.md
        - labs/lab-02-install-docker-overview.md
    - part: "5–6. The workbench"
      chapters:
        - guide/launch-novnc.md
        - guide/smoke-test.md
        - labs/lab-03-launch-the-workbench-overview.md
    - part: "7. Wrap-up"
      chapters:
        - guide/tapeout-flow.md
  appendices:
    - reference/troubleshooting.md

format:
  typst:
    toc: true
    toc-depth: 1
